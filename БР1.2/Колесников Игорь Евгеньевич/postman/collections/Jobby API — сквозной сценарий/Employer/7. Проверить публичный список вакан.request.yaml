$kind: http-request
name: 7. Проверить публичный список вакансий
url: "{{baseUrl}}/vacancies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const d=pm.response.json(); pm.test('В списке есть созданная вакансия',()=>pm.expect(d.data.some(v=>v.id===pm.collectionVariables.get('vacancy_id'))).to.eql(true));
    language: text/javascript
order: 3000
