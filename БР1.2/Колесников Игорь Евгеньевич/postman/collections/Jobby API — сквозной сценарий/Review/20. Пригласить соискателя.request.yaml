$kind: http-request
url: "{{baseUrl}}/applications/{{application_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"status":"INVITED"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Статус изменён',()=>pm.expect(pm.response.json().status).to.eql('INVITED'));
    language: text/javascript
order: 3000
