$kind: http-request
url: "{{baseUrl}}/resumes/{{resume_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Стаж равен 42 месяцам',()=>pm.expect(pm.response.json().experienceMonths).to.eql(42));
    language: text/javascript
order: 5000
