$kind: http-request
url: "{{baseUrl}}/resumes/{{resume_id}}/work-experience"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"companyName":"Пример","role":"Backend-разработчик","startDate":"2020-06-01","endDate":"2023-12-31"}'
scripts:
