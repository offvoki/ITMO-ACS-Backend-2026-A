$kind: http-request
name: "9. Регистрация соискателя: шаг 1"
url: "{{baseUrl}}/auth/register/step1"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{seeker_email}}","password":"StrongPass123!","role":"SEEKER"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('seeker_email', 'seeker-' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.collectionVariables.set('seeker_temp_token', pm.response.json().temporaryToken);
      pm.test('Временный токен соискателя получен', () => pm.expect(pm.collectionVariables.get('seeker_temp_token')).to.be.a('string'));
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
