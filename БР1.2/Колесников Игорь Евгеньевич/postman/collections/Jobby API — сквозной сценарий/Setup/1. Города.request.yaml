$kind: http-request
url: "{{baseUrl}}/dictionaries/cities"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const city = pm.response.json().find(x => x.name === 'Санкт-Петербург'); pm.test('Город Санкт-Петербург найден', () => pm.expect(city).to.exist); pm.collectionVariables.set('city_id', city.id);
    language: text/javascript
order: 1000
