server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health/user        { proxy_pass http://127.0.0.1:3101/health; }
    location = /health/vacancy     { proxy_pass http://127.0.0.1:3102/health; }
    location = /health/resume      { proxy_pass http://127.0.0.1:3103/health; }
    location = /health/application { proxy_pass http://127.0.0.1:3104/health; }
    location = /health/dictionary  { proxy_pass http://127.0.0.1:3105/health; }

    location ^~ /api/v1/auth         { proxy_pass http://127.0.0.1:3101; }
    location ^~ /api/v1/profile      { proxy_pass http://127.0.0.1:3101; }
    location ^~ /api/v1/companies    { proxy_pass http://127.0.0.1:3102; }
    location ^~ /api/v1/vacancies    { proxy_pass http://127.0.0.1:3102; }
    location ^~ /api/v1/employer     { proxy_pass http://127.0.0.1:3102; }
    location ^~ /api/v1/resumes      { proxy_pass http://127.0.0.1:3103; }
    location ^~ /api/v1/applications { proxy_pass http://127.0.0.1:3104; }
    location ^~ /api/v1/dictionaries { proxy_pass http://127.0.0.1:3105; }

    location / { return 404; }
}
